<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Premium luxury storefront for headphones and travel accessories with immersive sound, dark surfaces, gold accents, and editorial product storytelling."
    />
    <title>Luxury Audio Atelier</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111111;
        color: #f5f5f5;
      }
      header {
        padding: 24px 40px;
        border-bottom: 1px solid #2a2a2a;
      }
      main {
        padding: 48px 40px;
      }
      .accent {
        color: #c9a84c;
      }
      .panel {
        background: #1c1c1c;
        border: 1px solid #2f2f2f;
        padding: 24px;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong class="accent">Luxury Audio Atelier</strong>
    </header>
    <main>
      <div class="panel">
        <h1>Immersive sound for modern travel</h1>
        <p>
          Premium headphones, dark luxury presentation, editorial campaign
          imagery, crafted materials, and gold highlight details.
        </p>
      </div>
    </main>
  </body>
</html>
